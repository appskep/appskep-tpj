root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  delay = 300
  # Go and SQL only, under cmd/ and internal/ only.
  #
  # Deliberately NOT watching template/: the renderer reparses templates on every
  # request when ENV=development, so an HTML edit shows up on the next request
  # with no rebuild and no restart.
  #
  # Deliberately NOT watching static/: `make dev` runs the Tailwind watcher, and
  # it writes static/css/app.css. Watching that directory — or the css extension
  # anywhere — made every CSS rebuild restart the Go server, so a single keystroke
  # in a template dropped in-flight requests. Tailwind watches template/ itself
  # through the @source directive in input.css.
  include_ext = ["go", "sql"]
  include_dir = ["cmd", "internal"]
  exclude_dir = ["bin", "tmp", ".tools", "node_modules", "static", "template"]
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  follow_symlink = false
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = false

[log]
  time = true

[misc]
  clean_on_exit = true
